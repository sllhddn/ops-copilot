name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API – typecheck, tests, evals (embedded PostgreSQL)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - run: npm run build

  api-postgres:
    name: API – migrations, seed and evals on PostgreSQL 16 + pgvector
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run seed:dist
      - run: npm run eval
      - name: Boot the API and smoke-test it
        run: |
          PORT=3000 node dist/main.js &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
          curl -sf -X POST localhost:3000/api/ask -H 'Content-Type: application/json' \
            -d '{"question":"What order do we switch over during a DR drill?"}' | tee /dev/stderr | grep -q '"grounded":true'

  web:
    name: Web – tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ops-copilot-api ./api
      - run: docker build -t ops-copilot-web ./web

  terraform:
    name: Terraform – validate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/aws } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate
